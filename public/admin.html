<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Character encoding -->
    <meta charset="UTF-8">
    <!-- Responsive design for mobile devices -->
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
    <!-- Browser tab title -->
    <title>Admin - Grind & Glow</title>
    <!-- Connect external CSS file -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- Navigation menu -->
    <nav>
        <!-- Website logo/title -->
        <h2>Grind & Glow</h2>

        <!-- Navigation links -->
        <div class="nav-links">

            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="basket.html">Basket</a>
            <a href="checkout.html">Checkout</a>
            <a href="admin.html">Admin</a>

        </div>

    </nav>

    <!-- Admin page heading section -->
    <section class="page-header">

        <!-- Main heading -->
        <h1>Admin Price Update</h1>

        <!-- Short description -->
        <p>Update product prices when market prices change.</p>
    </section>

    <!-- Container for admin form -->
    <div class="checkout-container">
        <!-- Form used to update product prices -->
        <form id="adminForm">
            <!-- Product ID input from database -->
            <input type="number"
                id="productId"
                placeholder="Product ID">
            <!-- Input for new updated product price -->
            <input type="number"
                id="newPrice"
                step="0.01"
                placeholder="New Price">

            <!-- Submit button -->
            <button type="submit">  Update Price </button>
        </form>

    </div>

    <!-- Footer section -->
    <footer>

        <p> © 2026 Grind & Glow Coffee Shop</p>

    </footer>
    <!-- Connect JavaScript functionality -->
    <script src="js/admin.js"></script>

</body>

</html>
