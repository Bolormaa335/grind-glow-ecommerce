<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Admin - Grind & Glow</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation -->
    <nav>
        <h2>Grind & Glow</h2>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="basket.html">Basket</a>
            <a href="checkout.html">Checkout</a>
            <a href="admin.html">Admin</a>
        </div>
    </nav>

    <!-- Page heading -->
    <section class="page-header">
        <h1>Admin Price Update</h1>

        <p>
            Update product prices when market prices change.
        </p>
    </section>

    <!-- Admin form container -->
    <div class="checkout-container">

        <form id="adminForm">

            <!-- Product id from database -->
            <input type="number"
                id="productId"
                placeholder="Product ID">

            <!-- New product price -->
            <input type="number"
                id="newPrice"
                step="0.01"
                placeholder="New Price">

            <button type="submit">
                Update Price
            </button>

        </form>

    </div>

    <footer>
        <p>© 2026 Grind & Glow Coffee Shop</p>
    </footer>

    <script src="js/admin.js"></script>

</body>

</html>
